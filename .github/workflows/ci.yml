name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned official MoonBit
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          echo "46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe  /tmp/install-moonbit.sh" | sha256sum -c -
          bash /tmp/install-moonbit.sh '0.10.18+6c83a7f62'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain and interface stability
        run: |
          moon version --all
          moon version --all | grep -F 'moonc v0.10.18+6c83a7f62'
          moon info
          moon fmt --check
          git diff --exit-code -- '*.mbti'
      - name: Strict check test and build
        run: |
          moon check --deny-warn --target ${{ matrix.target }}
          moon test --deny-warn --target ${{ matrix.target }}
          moon build --deny-warn --target ${{ matrix.target }}
      - name: Execute downstream workflows
        run: |
          moon run examples/quality --deny-warn --target ${{ matrix.target }}
          moon run examples/terrain --deny-warn --target ${{ matrix.target }}
          moon run examples/ingest --deny-warn --target ${{ matrix.target }}
      - name: Production source floor
        run: python3 tools/audit_source.py
  independent-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned official MoonBit
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          echo "46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe  /tmp/install-moonbit.sh" | sha256sum -c -
          bash /tmp/install-moonbit.sh '0.10.18+6c83a7f62'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Regenerate 352 independent records and changed-write vectors
        run: |
          python -m pip install --disable-pip-version-check laspy==2.6.1 numpy==2.2.6
          python tools/generate_oracles.py
          moon fmt
          git diff --exit-code -- reference_wbtest.mbt tools/oracle-manifest.json
          moon test --deny-warn
